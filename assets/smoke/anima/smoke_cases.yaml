schema_version: 1
# Each case declares which model family and control path its workflow uses, and
# the exact filenames that must be loaded. That keeps profile-specific model
# names out of the code, so a new profile only needs its own YAML.

cases:
  - id: base_t2i
    title: "Anima-Base text to image"
    workflow: anima_base_t2i.api.json
    timeout_minutes: 15
    family: unet
    control: none
    expect_model:
      unet: anima-base-v1.0.safetensors
      vae: qwen_image_vae.safetensors
      clip: qwen_3_06b_base.safetensors
    expect_sampler: {steps: 30, cfg: 4.0}
    inputs: []
    overrides:
      "6": {seed: "$run_seed"}
    expect:
      width: 1024
      height: 1024

  - id: lllite_lineart
    title: "Anima-Base + LLLite mixed line-art control"
    workflow: anima_base_lllite_lineart.api.json
    timeout_minutes: 15
    family: unet
    control: lllite
    expect_model:
      unet: anima-base-v1.0.safetensors
      lllite: anima-lllite-any-test-like-v2.safetensors
      vae: qwen_image_vae.safetensors
      clip: qwen_3_06b_base.safetensors
    expect_sampler: {steps: 30, cfg: 4.0}
    inputs:
      - vast_comfy_smoke_control.png
    overrides:
      "6": {seed: "$run_seed"}
    expect:
      width: 1024
      height: 1024

  - id: lllite_inpaint
    title: "Anima-Base + LLLite inpainting"
    workflow: anima_base_lllite_inpaint.api.json
    timeout_minutes: 15
    family: unet
    control: lllite_inpaint
    expect_model:
      unet: anima-base-v1.0.safetensors
      lllite: anima-lllite-inpainting-v2.safetensors
      vae: qwen_image_vae.safetensors
      clip: qwen_3_06b_base.safetensors
    expect_sampler: {steps: 30, cfg: 4.0}
    inputs:
      - vast_comfy_smoke_inpaint_src.png
    overrides:
      "6": {seed: "$run_seed"}
    expect:
      width: 1024
      height: 1024

  - id: turbo_t2i
    title: "Anima-Turbo text to image"
    workflow: anima_turbo_t2i.api.json
    timeout_minutes: 15
    family: unet
    control: none
    expect_model:
      unet: anima-turbo-v1.1.safetensors
      vae: qwen_image_vae.safetensors
      clip: qwen_3_06b_base.safetensors
    expect_sampler: {steps: 8, cfg: 1.0}
    inputs: []
    overrides:
      "6": {seed: "$run_seed"}
    expect:
      width: 1024
      height: 1024
