name: noobai_concept
# LoRA track: a concept LoRA trained on NoobAI-XL v1.1 (SDXL).
#
# The five training images under assets/lora/noobai_concept/train/ are the
# smoke material. They were generated from the same fixed prompt with one
# varied camera/situation clause per image, so the concept (and not the
# composition) is what the network has to learn.
base_checkpoint: NoobAI-XL-v1.1.safetensors
hf_repo: null            # set to "<user>/<repo>" once pushing is wanted
tag_threshold: 0.35      # WD14 confidence cut-off

train:
  images: 5
  steps: 500
  network_dim: 16
  network_alpha: 8
  learning_rate: 0.0001
  resolution: 1024
