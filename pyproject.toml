[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vast-comfy"
version = "0.1.0"
description = "vast-comfy: rent the cheapest qualifying Vast.ai GPU, deploy the official ComfyUI image with the Anima model family + Anima-LLLite, verify with real image generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]

[project.scripts]
vast-comfy = "vast_comfy.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "linux_only: test requires a Linux environment (flock, fcntl)",
]
